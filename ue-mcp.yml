ue-mcp:
  version: 1
  # Keep the MCP surface small: only editor defaults + Level, Blueprint,
  # Animation and Niagara are enabled. Other categories stay off.
  disable:
    - material
    - asset
    - landscape
    - pcg
    - foliage
    - audio
    - widget
    - gameplay
    - gas
    - networking
    - demo
    - feedback
  nativeTools:
    # Epic's native tool registry is UE 5.8+, while this project uses UE 5.4.
    enabled: false
  context:
    # One gateway tool; action details load only when needed.
    strategy: micro
  contentRoots:
    - /Game/

tasks: {}
flows: {}
